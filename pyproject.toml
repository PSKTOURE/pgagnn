[project]
name = "ga-gnn"
version = "0.1.0"
description = "GA-GNN env"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "e3nn>=0.5.4",
  "einops==0.8.1",
  "h5py>=3.15.1",
  "ipykernel==7.1.0",
  "ipython==8.37.0",
  "ipywidgets==8.1.8",
  "matplotlib==3.10.8",
  "networkx==3.4.2",
  "numpy==1.24.4",
  "opt-einsum>=3.4.0",
  "pandas>=2.1.0",
  "pip>=26.0.1",
  "pyg-lib==0.5.0",
  "pytest>=8.0.0",
  "python-dotenv>=1.2.2",
  "scipy==1.15.3",
  "seaborn>=0.13.2",
  "tensorboard>=2.20.0",
  "torch==2.8.0",
  "torch-cluster==1.6.3",
  "torch-geometric==2.7.0",
  "torch-scatter==2.1.2",
  "torch-sparse==0.6.18",
  "torch-spline-conv==1.2.2",
  "torchvision==0.23.0",
  "tqdm==4.67.1",
  "triton==3.4.0",
  "xformers>=0.0.32.post2",
]

[tool.uv]
find-links = [
    "https://data.pyg.org/whl/torch-2.8.0+cu128.html",
    "https://data.pyg.org/whl/torch-2.8.0+cpu.html"
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "geometric-algebra-transformer",
    "egnn",
    "Steerable-E3-GNN/models",
]


